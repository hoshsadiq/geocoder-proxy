# geocoder-proxy developer tooling.
#
# mise is the single source of truth for tool versions and developer tasks.
# Run `mise tasks` to list everything, `mise run <task>` to run one.
# Tasks live as file tasks under mise/tasks/.

[tools]
go = "1.27.2"
prek = "0.5.5"
golangci-lint = "2.14.0"
gofumpt = "0.12.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"go:golang.org/x/tools/cmd/goimports" = "v0.51.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
# renovate-config-validator runs via npx in .github/workflows/renovate-validate.yml:
# npm:renovate fails mise's trust policy (@yarnpkg/libzip@3.2.2 lost the
# provenance attestation 3.2.0 had), which breaks `mise install` for everyone.
"npm:markdownlint-cli2" = "0.23.3"

[env]
GOFLAGS = "-mod=readonly"
