# geocoder-proxy developer tooling.
#
# mise is the single source of truth for tool versions and developer tasks.
# Run `mise tasks` to list everything, `mise run <task>` to run one.
# Tasks live as file tasks under mise/tasks/.

[tools]
go = "1.27.1"
prek = "0.5.5"
golangci-lint = "2.14.0"
gofumpt = "0.12.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
"go:golang.org/x/tools/cmd/goimports" = "v0.51.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
"npm:renovate" = "44.115.10"
"npm:markdownlint-cli2" = "0.23.3"

[env]
CGO_ENABLED = "0"
GOFLAGS = "-mod=readonly"
