name: Cross build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cross_build:
    name: Cross build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: linux/amd64 linux/arm64
          - runner: macos-latest
            targets: darwin/amd64 darwin/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.0"
          install: true
          cache: true
          experimental: true

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cross build (${{ matrix.targets }})
        # CGO is off, so a plain go build cross-compiles without a C toolchain.
        run: |
          for target in ${{ matrix.targets }}; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch go build -o "tmp/geocoder-proxy-$os-$arch" ./cmd/geocoder-proxy
          done
