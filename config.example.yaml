# geocoder-proxy example configuration.
#
# Precedence: environment (GEOCODER_*) > this file > defaults.
# --config or GEOCODER_CONFIG selects the file.
# Flat settings have env equivalents: GEOCODER_LISTEN_ADDR, GEOCODER_OPS_ADDR,
# GEOCODER_REQUEST_TIMEOUT, GEOCODER_UPSTREAM_TIMEOUT,
# GEOCODER_CACHE_TTL, GEOCODER_CACHE_MAX_ENTRIES,
# GEOCODER_CACHE_MAX_REUSE_DISTANCE.
# GEOCODER_PROVIDERS selects and orders providers by name;
# GEOCODER_PROVIDER_<NAME>_<FIELD> overrides each provider's settings
# (BASE_URL, API_KEY, USER_AGENT, RATE_PER_SECOND, DAILY_QUOTA, TYPE, TIER).
# Keys are validated: unknown keys and invalid values fail startup.

listen_addr: ":8080"
ops_addr: ":9090"

# Per-request budget. A lookup still unanswered when it runs out is answered
# 503, so Dawarich sees a transient error and retries, rather than a client-side
# timeout at its own 5s limit.
request_timeout: 4s
# Cap on one provider attempt. At most half the budget, so there is time to try
# the next provider when one is slow. Lookups arriving together queue on each
# provider's rate limit, so the budget can also go on waiting rather than on a
# provider.
upstream_timeout: 2s

cache:
  ttl: 720h
  max_entries: 100000
  # How close a request must be to a house-numbered answer's coordinates to
  # reuse it, in metres.
  max_reuse_distance: 25

# Providers are tried in the order written. A `tier` groups providers that
# rotate among themselves: successive lookups start at the next provider in the
# group, so several instances share the load. A later tier is reached only once
# every provider before it failed or ran out of quota, which is where a public
# rescue service belongs. Leave `tier` out and each provider stands on its own,
# tried in the order written.
#
# The tier number decides the order, not where the entry is written: tier 2 is
# tried before tier 10 either way. A tier is a whole number from 1 to 1000000,
# and an entry with no tier must not land on a number another entry sets
# explicitly; that fails startup naming both providers.
#
# Every entry needs a `name`, unique in this list. `type` names the provider to
# use and defaults to `name`, so set it only when the same type appears more
# than once. rate_per_second paces calls and daily_quota caps them over a
# rolling 24-hour window (0 = unlimited); both are per instance.
providers:
  - name: chibi-eu
    type: chibigeo
    # api_key: set GEOCODER_PROVIDER_CHIBI_EU_API_KEY, never in a committed file
    rate_per_second: 1
    daily_quota: 2500
    tier: 1
  - name: chibi-us
    type: chibigeo
    # api_key: set GEOCODER_PROVIDER_CHIBI_US_API_KEY
    rate_per_second: 1
    daily_quota: 2500
    tier: 1
  - name: geoapify
    # api_key: GEOCODER_PROVIDER_GEOAPIFY_API_KEY
    rate_per_second: 5
    daily_quota: 3000
    tier: 1
  - name: locationiq
    # api_key: GEOCODER_PROVIDER_LOCATIONIQ_API_KEY
    rate_per_second: 2
    daily_quota: 5000
    tier: 1
  - name: nominatim
    # A public rescue service: later tier and a small daily quota, so rotation
    # never hands it a steady share of an import.
    # The public instance's usage policy requires an identifying User-Agent.
    user_agent: "geocoder-proxy/0.1 (https://github.com/hoshsadiq/geocoder-proxy)"
    rate_per_second: 1
    daily_quota: 500
    tier: 2
